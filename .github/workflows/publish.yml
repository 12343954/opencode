name: publish

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version, for example 1.18.35-tts.1"
        required: false
        type: string

permissions:
  contents: write

concurrency: publish-${{ github.ref }}

jobs:
  desktop:
    name: desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            package_flags: --win --x64
          - name: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            package_flags: --linux --x64
          - name: macos-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            package_flags: --mac --x64
          - name: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            package_flags: --mac --arm64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            version="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-bun

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Prepare desktop
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: dev
          RUST_TARGET: ${{ matrix.rust_target }}

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: dev
          RUST_TARGET: ${{ matrix.rust_target }}
          OPENCODE_UNSIGNED_DESKTOP: "true"

      - name: Package desktop
        working-directory: packages/desktop
        run: npx electron-builder ${{ matrix.package_flags }} --publish never --config electron-builder.config.ts
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: dev
          RUST_TARGET: ${{ matrix.rust_target }}
          OPENCODE_UNSIGNED_DESKTOP: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-${{ matrix.name }}
          path: packages/desktop/dist/*
          if-no-files-found: error

  release:
    name: release
    needs: desktop
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-desktop-*
          path: dist-release
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: |
            dist-release/*.exe
            dist-release/*.blockmap
            dist-release/*.dmg
            dist-release/*.zip
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/*.rpm
